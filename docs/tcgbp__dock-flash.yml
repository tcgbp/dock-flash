# dsh-market submission entry for dock-flash.
#
# To submit: copy this file to
#   <your-fork-of-awesome-dsh-plugin>/data/plugins/tcgbp__dock-flash.yml
# and open a PR against https://github.com/awesome-dsh-plugin/awesome-dsh-plugin.
# After it is merged, update it here rather than in a second place.
#
# Rules enforced by the registry's own scripts/lib/entries.mjs::validateEntries:
#   - only these keys: url, name, category, description, tarball
#     (no `npm:` key — the npm mapping is resolved from the repository)
#   - filename must equal slugFor(url): <owner>__<repo>.yml
#   - category must be one of the registry's CAT_IDS (this one is `ui`)
#   - description.en is required, single line; description.zh is optional
#   - tarball must be https on GitHub release hosting and end in .tgz/.tar.gz
# Verified locally against that module: 0 problems.
#
# The tarball is deliberately the version-free releases/latest/download/ URL. Which release that is
# stays a release-side decision rather than something this file has to follow: publishing a new
# Release moves the URL by itself, so the entry needs no edit and no pull request per release.
# Pinning it to a tag would trade that for a manual follow-up every time.
#
# The tarball is the FALLBACK, not what users normally receive. Measured 2026-10: dsh-market's
# installTargetFor() resolves an entry's npm name FIRST (entry.npm), then this Release tarball, then
# `github:<owner>/<repo>` — and that machine's market log shows dock-flash@1.6.1 installed from the
# registry. The registry resolves the npm mapping from the PUBLISHED package's own `repository` field,
# which is why package.json must name github.com/tcgbp/dock-flash: a missing mapping leaves this
# tarball in use, and a WRONG `repository` maps the package to somebody else's entry — and since it is
# published metadata, fixing it later costs a release.
#
# Submission state, checked 2026-09-20: the GitHub repo carries the required `dsh-plugin` topic and
# /releases/latest serves v1.2.0 with dock-flash.tgz attached, so the entry below is ready as-is. The
# one prerequisite that is not ours to satisfy is the registry's repo-age gate — the GitHub mirror was
# created 2026-09-19, so a PR may be rejected as too new until that window has passed.
# Later check, 2026-10: the entry IS in the registry (data/plugins/tcgbp__dock-flash.yml, HTTP 200), so
# the gate has passed and nothing needs submitting. Update this file if the entry ever changes.
url: https://github.com/tcgbp/dock-flash
name: tcgbp/dock-flash
category: ui
description:
  en: 'Quick Control panel for DSH Web: a docked or floating shortcut panel whose switches other plugins register through the quickControl service. Includes a theme and skin switcher plus fine-grained NO_PROXY proxy controls, and works with dock-base or standalone.'
  zh: DSH Web 的快捷控制面板：可停靠或浮动，开关项可由其它插件通过 quickControl 服务注册；内置主题/皮肤切换与细粒度 NO_PROXY 代理控制，可搭配 dock-base 或独立运行。
tarball: https://github.com/tcgbp/dock-flash/releases/latest/download/dock-flash.tgz
